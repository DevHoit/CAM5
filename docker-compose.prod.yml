# CAM5 CORE — producción en hoitlive.com/cam5
#
#   cp .env.prod.example .env && nano .env
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api node src/migrate.ts
#   docker compose -f docker-compose.prod.yml exec api node src/seed.ts

services:
  db:
    image: postgres:16-alpine
    container_name: cam5-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cam5
      POSTGRES_USER: cam5
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      # Zona horaria en UTC: toda marca de tiempo del sistema se guarda en UTC
      # y se convierte sólo al mostrarla.
      TZ: UTC
    volumes:
      - cam5-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cam5 -d cam5"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin `ports`: la base sólo es alcanzable desde la red interna de Docker.
    networks: [cam5]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: cam5-api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://cam5:${POSTGRES_PASSWORD}@db:5432/cam5
      PORT: 8787
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CAM5_REQUIRE_HMAC: "true"
      CAM5_RAW_RETENTION_DAYS: ${CAM5_RAW_RETENTION_DAYS:-90}
      CAM5_REPORT_DIR: /data/reports
      # Mismo origen que el portal: no hace falta lista blanca de CORS.
      CAM5_CORS_ORIGINS: ${CAM5_CORS_ORIGINS:-}
      CAM5_DEV_USER: ${CAM5_DEV_USER:-}
    volumes:
      - cam5-reports:/data/reports
    networks: [cam5]

  portal:
    build:
      context: ./portal
      args:
        # Se hornea en el build: Next.js resuelve NEXT_PUBLIC_* en tiempo de compilación.
        NEXT_PUBLIC_CAM5_API_URL: /cam5/api/v1
        NEXT_PUBLIC_CAM5_ASSET_ID: ${CAM5_ASSET_ID:-MCC-01}
        NEXT_PUBLIC_CAM5_BASE_PATH: /cam5
    container_name: cam5-portal
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks: [cam5]

  # Agregación y poda de particiones. Proceso aparte para que un problema aquí
  # nunca afecte la ingesta.
  rollup:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: cam5-rollup
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://cam5:${POSTGRES_PASSWORD}@db:5432/cam5
      CAM5_RAW_RETENTION_DAYS: ${CAM5_RAW_RETENTION_DAYS:-90}
    command: ["node", "src/rollup.ts", "--loop", "60"]
    networks: [cam5]

  caddy:
    image: caddy:2-alpine
    container_name: cam5-caddy
    restart: unless-stopped
    depends_on: [api, portal]
    ports:
      - "80:80"
      - "443:443"
    environment:
      CAM5_DOMAIN: ${CAM5_DOMAIN:?define CAM5_DOMAIN en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [cam5]

volumes:
  cam5-db:
  cam5-reports:
  caddy-data:
  caddy-config:

networks:
  cam5:
